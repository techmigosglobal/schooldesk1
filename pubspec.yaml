name: schooldesk1
description: A new Flutter project.
publish_to: none
version: 1.0.26+38

environment:
  sdk: ^3.9.0

dependencies:
  flutter:       # CRITICAL: Required for every Flutter project - DO NOT REMOVE
    sdk: flutter # CRITICAL: Required for every Flutter project - DO NOT REMOVE
  
  # CRITICAL: Core UI and responsive design - DO NOT REMOVE OR MODIFY
  sizer: ^3.1.3              # Required for responsive design system
  flutter_svg: ^2.3.0        # Required for SVG icon support
  google_fonts: ^8.2.1       # Required for typography (replaces local fonts)
  shared_preferences: ^2.5.5 # Required for local data storage
  
  # Feature dependencies - safe to modify
  cached_network_image: ^4.0.2
  dio: ^5.4.0
  freezed_annotation: ^3.1.0
  flutter_secure_storage: ^11.2.0
  intl: ^0.20.2
  image_picker: ^1.1.2
  image_cropper: ^12.2.1
  cross_file: ^0.3.5+5
  image: ^4.10.1
  pdf: ^3.13.1
  printing: ^5.14.3
  provider: ^6.1.5+1
  retrofit: ^4.9.2
  # Required by json_serializable for generated Retrofit/Freezed DTO sources.
  json_annotation: ^4.12.0

  firebase_core: ^4.7.0
  firebase_crashlytics: ^5.0.7
  firebase_messaging: ^16.2.0
  flutter_local_notifications: ^22.3.1
  video_player: ^2.14.0
  package_info_plus: ^10.2.1
  file_picker: ^13.1.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  share_plus: ^13.3.0
  auto_size_text: ^3.0.0
  collection: ^1.18.0
  flutter_cache_manager: ^3.4.5
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  connectivity_plus: ^7.3.1
  workmanager: ^0.10.10
  path_provider: ^2.1.6
  table_calendar: ^3.2.1
  supabase_flutter: ^2.17.2
  window_manager: ^0.5.2
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
dev_dependencies:
  flutter_test:    # CRITICAL: Required for Flutter project testing - DO NOT REMOVE
    sdk: flutter   # CRITICAL: Required for Flutter project testing - DO NOT REMOVE
  very_good_analysis: ^11.0.0
  riverpod_lint: ^3.1.9
  dependency_validator: ^5.1.0
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  freezed: ^4.0.1
  integration_test:
    sdk: flutter
  json_serializable: ^6.14.1
  retrofit_generator: ^10.2.11
  test: ^1.26.3

dependency_overrides:
  printing:
    path: third_party/flutter_plugins/printing
  # Flutter 3.47 statically detects the legacy KGP apply syntax in these
  # otherwise AGP 9-compatible plugin releases. The local copies only replace
  # that syntax; Dart and native behavior remain the resolved pub versions.
  firebase_core:
    path: third_party/flutter_plugins/firebase_core
  firebase_crashlytics:
    path: third_party/flutter_plugins/firebase_crashlytics
  workmanager_android:
    path: third_party/flutter_plugins/workmanager_android
flutter:
  uses-material-design: true # CRITICAL: Required for Material icon font - DO NOT REMOVE
  assets:
    - assets/
    - assets/branding/
    - assets/images/
    - assets/images/ui/
    - assets/google_fonts/
    - assets/policy/admin_principal_ownership_matrix.json
  # CRITICAL ASSET MANAGEMENT RULES:
  # - Only use asset directories listed above.
  # - Google Fonts are bundled locally to avoid runtime network fetching.
  
  # CRITICAL FONTS RULE:
  # - This project uses the google_fonts package with local bundled font files.
  # - Do not enable runtime font fetching for production/mobile builds.
