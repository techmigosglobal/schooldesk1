appId: com.techmigos.schooldesk1
---
- launchApp:
    clearState: true
- runFlow: subflows/login_teacher.yaml
- extendedWaitUntil:
    visible: "Quick Actions"
    timeout: 20000
- runFlow: subflows/open_teacher_drawer.yaml
- scrollUntilVisible:
    element: "Timetable"
    direction: DOWN
    timeout: 20000
- tapOn: "Timetable"
- extendedWaitUntil:
    visible: "Weekly Timetable"
    timeout: 20000
- assertVisible: "Weekly Timetable"
- scrollUntilVisible:
    element: "Monday"
    direction: DOWN
    timeout: 15000
- assertVisible: "Monday"
- scrollUntilVisible:
    element: "Tuesday"
    direction: DOWN
    timeout: 15000
- assertVisible: "Tuesday"
