appId: com.techmigos.schooldesk1
---
- launchApp:
    clearState: true
- runFlow: subflows/login_teacher.yaml
- extendedWaitUntil:
    visible: "Quick Actions"
    timeout: 20000
- scrollUntilVisible:
    element: "Track Leave"
    direction: DOWN
    timeout: 15000
- tapOn: "Track Leave"
- extendedWaitUntil:
    visible: "My Leaves"
    timeout: 20000
- tapOn: "Apply Leave"
- extendedWaitUntil:
    visible: "Apply Leave"
    timeout: 20000
- tapOn: "Reason"
- inputText: "Maestro leave approval handoff"
- hideKeyboard
- tapOn: "Submit Leave"
- extendedWaitUntil:
    visible: "My Leaves"
    timeout: 20000
- scrollUntilVisible:
    element: "Maestro leave approval handoff"
    direction: DOWN
    timeout: 20000
- assertVisible: "Maestro leave approval handoff"
- launchApp:
    clearState: true
- runFlow: subflows/login_principal.yaml
- extendedWaitUntil:
    visible: "Principal Action Queue"
    timeout: 20000
- scrollUntilVisible:
    element: "Access Approvals"
    direction: DOWN
    timeout: 20000
- tapOn: "Access Approvals"
- extendedWaitUntil:
    visible: "Access & Permissions"
    timeout: 20000
- runFlow: subflows/open_principal_drawer.yaml
- tapOn: "Approval Center"
- extendedWaitUntil:
    visible: "Approval Center"
    timeout: 20000
- tapOn: "Leave"
- scrollUntilVisible:
    element: "Maestro leave approval handoff"
    direction: DOWN
    timeout: 20000
- assertVisible: "Maestro leave approval handoff"
