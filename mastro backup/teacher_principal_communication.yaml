appId: com.techmigos.schooldesk1
---
- launchApp:
    clearState: true
- runFlow: subflows/login_teacher.yaml
- extendedWaitUntil:
    visible: "Quick Actions"
    timeout: 20000
- scrollUntilVisible:
    element: "Mark Student Attendance"
    direction: DOWN
    timeout: 15000
- tapOn: "Mark Student Attendance"
- extendedWaitUntil:
    visible: "Student Attendance"
    timeout: 20000
- runFlow: subflows/open_teacher_drawer.yaml
- tapOn: "Parent Messages"
- extendedWaitUntil:
    visible: "Communication"
    timeout: 20000
- assertVisible: "Visible to Principal monitoring"
- back
- runFlow: subflows/open_teacher_drawer.yaml
- tapOn: "Homework Feedback"
- extendedWaitUntil:
    visible: "Homework Feedback"
    timeout: 20000
- launchApp:
    clearState: true
- runFlow: subflows/login_principal.yaml
- extendedWaitUntil:
    visible: "Academics"
    timeout: 20000
- scrollUntilVisible:
    element: "Message Oversight"
    direction: DOWN
    timeout: 20000
- tapOn: "Message Oversight"
- extendedWaitUntil:
    visible: "Communication"
    timeout: 20000
- tapOn: "Teacher Chats"
- extendedWaitUntil:
    visible: "Teacher Chats"
    timeout: 20000
- assertVisible: "Monitor teacher to parent chats"
