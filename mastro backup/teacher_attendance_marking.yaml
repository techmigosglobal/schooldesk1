appId: com.techmigos.schooldesk1
---
- launchApp:
    clearState: true
- runFlow: subflows/login_teacher.yaml
- extendedWaitUntil:
    visible: "Quick Actions"
    timeout: 20000
- scrollUntilVisible:
    element: "Mark Student Attendance"
    direction: DOWN
    timeout: 15000
- tapOn: "Mark Student Attendance"
- extendedWaitUntil:
    visible: "Student Attendance"
    timeout: 20000
- assertVisible: "Attendance selection"
- assertVisible: "Swipe-free Quick Marking"
- tapOn: "All Present"
- assertVisible: "Present"
- tapOn: "Save Draft"
- extendedWaitUntil:
    visible: "Draft saved"
    timeout: 20000
- tapOn: "Submit Final"
- extendedWaitUntil:
    visible: "Attendance submitted and locked"
    timeout: 20000
- assertVisible: "Attendance locked"
- tapOn: "Later"
