appId: com.techmigos.schooldesk1
---
- launchApp:
    clearState: true
- runFlow: subflows/login_teacher.yaml
- extendedWaitUntil:
    visible: "Quick Actions"
    timeout: 20000
- scrollUntilVisible:
    element: "Mark Student Attendance"
    direction: DOWN
    timeout: 15000
- tapOn: "Mark Student Attendance"
- extendedWaitUntil:
    visible: "Student Attendance"
    timeout: 20000
- tapOn: "Request Correction"
- assertVisible: "Request Correction"
- tapOn: "Reason"
- inputText: "Maestro correction check"
- hideKeyboard
- tapOn: "Send"
- extendedWaitUntil:
    visible: "Correction request sent to principal"
    timeout: 20000
- launchApp:
    clearState: true
- runFlow: subflows/login_principal.yaml
- extendedWaitUntil:
    visible: "Principal Action Queue"
    timeout: 20000
- scrollUntilVisible:
    element: "Correction Requests"
    direction: DOWN
    timeout: 15000
- tapOn: "Correction Requests"
- extendedWaitUntil:
    visible: "Student Attendance Monitor"
    timeout: 20000
- tapOn: "Monitor"
- scrollUntilVisible:
    element: "Needs Review"
    direction: DOWN
    timeout: 20000
- tapOn: "Needs Review"
- tapOn: "Reopen Attendance"
- tapOn: "Reason"
- inputText: "Maestro reopen approval"
- hideKeyboard
- tapOn: "Reopen"
- extendedWaitUntil:
    visible: "Attendance reopened"
    timeout: 20000
