appId: com.techmigos.schooldesk1
---
- launchApp:
    clearState: true
- runFlow: subflows/login_principal.yaml
- extendedWaitUntil:
    visible: "Principal Action Queue"
    timeout: 20000
- scrollUntilVisible:
    element: "Review Attendance"
    direction: DOWN
    timeout: 15000
- tapOn: "Review Attendance"
- extendedWaitUntil:
    visible: "Student Attendance Monitor"
    timeout: 20000
- back
- scrollUntilVisible:
    element: "Correction Requests"
    direction: DOWN
    timeout: 15000
- tapOn: "Correction Requests"
- extendedWaitUntil:
    visible: "Student Attendance Monitor"
    timeout: 20000
- back
- scrollUntilVisible:
    element: "Class Hub"
    direction: DOWN
    timeout: 20000
- tapOn: "Class Hub"
- extendedWaitUntil:
    visible: "Class Hub"
    timeout: 20000
- back
- scrollUntilVisible:
    element: "Event Approvals"
    direction: DOWN
    timeout: 20000
- tapOn: "Event Approvals"
- extendedWaitUntil:
    visible: "Event Approvals"
    timeout: 20000
- back
- launchApp:
    clearState: true
- runFlow: subflows/login_teacher.yaml
- extendedWaitUntil:
    visible: "Quick Actions"
    timeout: 20000
- assertVisible: "Today Action Queue"
- scrollUntilVisible:
    element: "Mark Student Attendance"
    direction: DOWN
    timeout: 15000
- tapOn: "Mark Student Attendance"
- extendedWaitUntil:
    visible: "Student Attendance"
    timeout: 20000
- back
- scrollUntilVisible:
    element: "Record Class Diary"
    direction: DOWN
    timeout: 15000
- tapOn: "Record Class Diary"
- extendedWaitUntil:
    visible: "Class Diary"
    timeout: 20000
- back
- scrollUntilVisible:
    element: "Post Homework"
    direction: DOWN
    timeout: 15000
- tapOn: "Post Homework"
- extendedWaitUntil:
    visible: "Homework / Assignments"
    timeout: 20000
- assertVisible: "Assign Homework"
- assertVisible: "Diary"
