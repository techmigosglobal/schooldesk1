appId: com.techmigos.schooldesk1
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "ArishVille Preschool"
    timeout: 15000
- tapOn:
    point: "84%,14%"
- tapOn: "Username"
- inputText: ${TEACHER_USERNAME || "teacher01"}
- tapOn: "Password"
- inputText: ${TEACHER_PASSWORD || "Teacher@12345"}
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Teacher portal"
    timeout: 20000
- tapOn:
    text: "Track Leave"
    optional: true
- tapOn:
    text: "Leave Requests"
    optional: true
- assertVisible:
    text: "My Leaves"
    optional: true
- tapOn:
    text: "Apply Leave"
    optional: true
- assertVisible:
    text: "Apply Leave"
    optional: true
- tapOn:
    text: "Reason"
    optional: true
- inputText: "Maestro leave approval handoff"
- tapOn:
    text: "Submit"
    optional: true
- assertVisible:
    text: "Leave request submitted"
    optional: true
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "ArishVille Preschool"
    timeout: 15000
- tapOn:
    point: "84%,14%"
- tapOn: "Username"
- inputText: ${PRINCIPAL_USERNAME || "principal"}
- tapOn: "Password"
- inputText: ${PRINCIPAL_PASSWORD || "Principal@12345"}
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Principal portal"
    timeout: 20000
- tapOn:
    text: "Approval Center"
    optional: true
- tapOn:
    text: "Access Approvals"
    optional: true
- assertVisible:
    text: "Approval"
    optional: true
- assertVisible:
    text: "Leave"
    optional: true
