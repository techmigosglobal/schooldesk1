appId: com.techmigos.schooldesk1
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "ArishVille Preschool"
    timeout: 15000
- tapOn:
    point: "84%,14%"
- tapOn: "Username"
- inputText: ${PRINCIPAL_USERNAME || "principal"}
- tapOn: "Password"
- inputText: ${PRINCIPAL_PASSWORD || "Principal@12345"}
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Principal portal"
    timeout: 20000
- assertVisible:
    text: "Principal Action Queue"
    optional: true
- assertVisible:
    text: "Review Attendance"
    optional: true
- assertVisible:
    text: "Correction Requests"
    optional: true
