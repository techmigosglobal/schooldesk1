appId: com.techmigos.schooldesk1
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "ArishVille Preschool"
    timeout: 15000
- tapOn: "Sign in to SchoolDesk\nSign in"
- extendedWaitUntil:
    visible: "Username"
    timeout: 15000
- tapOn: "Username"
- inputText: ${PRINCIPAL_USERNAME || "principal"}
- tapOn: "Password"
- inputText: ${PRINCIPAL_PASSWORD || "Principal@12345"}
- hideKeyboard
- tapOn:
    label: "Sign in"
- extendedWaitUntil:
    visible: "Principal Action Queue"
    timeout: 20000
- scrollUntilVisible:
    element: "Review Attendance"
    direction: DOWN
    timeout: 15000
- tapOn: "Review Attendance"
- extendedWaitUntil:
    visible: "Student Attendance Monitor"
    timeout: 20000
- assertVisible: "Sessions Today"
- assertVisible: "Present Today"
- assertVisible: "Staff Check-in Monitor"
- tapOn: "Monitor"
- assertVisible: "Class-period status, correction review, and registers"
- back

- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "ArishVille Preschool"
    timeout: 15000
- tapOn: "Sign in to SchoolDesk\nSign in"
- extendedWaitUntil:
    visible: "Username"
    timeout: 15000
- tapOn: "Username"
- inputText: ${TEACHER_USERNAME || "teacher01"}
- tapOn: "Password"
- inputText: ${TEACHER_PASSWORD || "Teacher@12345"}
- hideKeyboard
- tapOn:
    label: "Sign in"
- extendedWaitUntil:
    visible: "Quick Actions"
    timeout: 20000
- scrollUntilVisible:
    element: "Mark Student Attendance"
    direction: DOWN
    timeout: 15000
- tapOn: "Mark Student Attendance"
- extendedWaitUntil:
    visible: "Student Attendance"
    timeout: 20000
- assertVisible: "Attendance selection"
- assertVisible: "Swipe-free Quick Marking"
- tapOn: "All Present"
- assertVisible: "Present"
- tapOn: "Save Draft"
- extendedWaitUntil:
    visible: "Draft saved"
    timeout: 20000
- tapOn: "Submit Final"
- extendedWaitUntil:
    visible: "Attendance submitted and locked"
    timeout: 20000
- assertVisible: "Attendance locked"
- tapOn: "Later"
- back
- tapOn: "Open navigation"
- extendedWaitUntil:
    visible: "My Staff Attendance"
    timeout: 15000
- tapOn: "My Staff Attendance"
- extendedWaitUntil:
    visible: "My Attendance"
    timeout: 20000
- assertVisible: "Teacher QR attendance punch screen"
- assertVisible: "Punch In pending"

- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "ArishVille Preschool"
    timeout: 15000
- tapOn: "Sign in to SchoolDesk\nSign in"
- extendedWaitUntil:
    visible: "Username"
    timeout: 15000
- tapOn: "Username"
- inputText: ${PARENT_USERNAME || "parent01"}
- tapOn: "Password"
- inputText: ${PARENT_PASSWORD || "Parent@12345"}
- hideKeyboard
- tapOn:
    label: "Sign in"
- extendedWaitUntil:
    visible: "Parent Dashboard"
    timeout: 20000
- tapOn: "Open navigation"
- extendedWaitUntil:
    visible: "Attendance"
    timeout: 15000
- tapOn: "Attendance"
- extendedWaitUntil:
    visible: "My Child Attendance"
    timeout: 20000
- assertVisible: "Today status, month summary, calendar, and leave"
- assertVisible: "Leave Request"

- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "ArishVille Preschool"
    timeout: 15000
- tapOn: "Sign in to SchoolDesk\nSign in"
- extendedWaitUntil:
    visible: "Username"
    timeout: 15000
- tapOn: "Username"
- inputText: ${KIOSK_USERNAME || "kiosk"}
- tapOn: "Password"
- inputText: ${KIOSK_PASSWORD || "Kiosk@12345"}
- hideKeyboard
- tapOn:
    label: "Sign in"
- extendedWaitUntil:
    visible: "Staff Attendance QR Display"
    timeout: 20000
- assertVisible: "Attendance kiosk"
- assertVisible: "Staff QR"
