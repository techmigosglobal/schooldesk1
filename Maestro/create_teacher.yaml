appId: com.techmigos.schooldesk1
---
- launchApp:
    clearState: true
- runFlow: subflows/login_principal.yaml
- extendedWaitUntil:
    visible: "Academics"
    timeout: 20000
- scrollUntilVisible:
    element: "Access Approvals"
    direction: DOWN
    timeout: 20000
- tapOn: "Access Approvals"
- extendedWaitUntil:
    visible: "Access & Permissions"
    timeout: 20000
- runFlow:
    when:
      notVisible: ${TEACHER_USERNAME || "teacher01"}
    commands:
      - tapOn:
          label: "Create role login"
      - extendedWaitUntil:
          visible: "Create Account"
          timeout: 15000
      - tapOn: "Full name *"
      - inputText: "Maestro Teacher"
      - tapOn: "Username *"
      - inputText: ${TEACHER_USERNAME || "teacher01"}
      - tapOn: "Email *"
      - inputText: "maestro.teacher@schooldesk.test"
      - tapOn: "Password *"
      - inputText: ${TEACHER_PASSWORD || "Teacher@12345"}
      - hideKeyboard
      - tapOn: "Create Account"
      - extendedWaitUntil:
          visible: "Access & Permissions"
          timeout: 20000
- scrollUntilVisible:
    element: ${TEACHER_USERNAME || "teacher01"}
    direction: DOWN
    timeout: 20000
- assertVisible: ${TEACHER_USERNAME || "teacher01"}
