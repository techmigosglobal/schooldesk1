# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# Shared Dart and Flutter lint defaults from Very Good Ventures.
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    # Preserve the app's existing inference policy during the lint migration.
    # These VGV checks need a separate cleanup pass before they can be enabled.
    strict-casts: false
    strict-inference: false
    strict-raw-types: false
  exclude:
    - test/**
    - integration_test/**
    - build/**
    # Xcode/SwiftPM output can vendor full Flutter plugin source trees under
    # ios/build. Those third-party tests are not part of this application and
    # produce false analyzer errors (for example, their undeclared mockito
    # test dependency).
    - ios/build/**
    - Parent_Module_UI/**
    - third_party/**
    - '**/__MACOSX/**'
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  errors:
    # Keep release builds focused on production runtime issues.
    use_build_context_synchronously: ignore
    deprecated_member_use: ignore

linter:
  # The lint rules applied to this project can be customized below. A list of
  # available lints and their documentation is published at https://dart.dev/lints.
  #
  # Instead of disabling a lint rule for the entire project in the
  # section below, it can also be suppressed for a single line of code
  # or a specific dart file by using the `// ignore: name_of_lint` and
  # `// ignore_for_file: name_of_lint` syntax on the line or in the file
  # producing the lint.
  rules:
    # Baseline for the Very Good Analysis adoption (2026-09-20): these rules
    # produced 8,018 info diagnostics across the existing lib/pubspec tree on
    # first enablement. Keep their current findings out of the normal analyzer gate;
    # re-enable them incrementally as the related code is cleaned up.
    always_put_required_named_parameters_first: false
    always_use_package_imports: false
    async_return_with_no_await: false
    avoid_bool_literals_in_conditional_expressions: false
    avoid_catching_errors: false
    avoid_dynamic_calls: false
    avoid_equals_and_hash_code_on_mutable_classes: false
    avoid_escaping_inner_quotes: false
    avoid_field_initializers_in_const_classes: false
    avoid_multiple_declarations_per_line: false
    avoid_positional_boolean_parameters: false
    avoid_redundant_argument_values: false
    avoid_types_on_closure_parameters: false
    avoid_void_async: false
    cascade_invocations: false
    cast_nullable_to_non_nullable: false
    comment_references: false
    directives_ordering: false
    discarded_futures: false
    document_ignores: false
    lines_longer_than_80_chars: false
    matching_super_parameters: false
    no_default_cases: false
    no_literal_bool_comparisons: false
    noop_primitive_operations: false
    omit_local_variable_types: false
    only_throw_errors: false
    parameter_assignments: false
    prefer_asserts_with_message: false
    prefer_const_declarations: false
    prefer_const_literals_to_create_immutables: false
    prefer_constructors_over_static_methods: false
    prefer_foreach: false
    prefer_if_elements_to_conditional_expressions: false
    prefer_int_literals: false
    prefer_single_quotes: false
    public_member_api_docs: false
    sort_constructors_first: false
    sort_pub_dependencies: false
    specify_nonobvious_property_types: false
    unawaited_futures: false
    unnecessary_breaks: false
    unnecessary_ignore: false
    unnecessary_lambdas: false
    unnecessary_null_checks: false
    unnecessary_await_in_return: false
    unnecessary_parenthesis: false
    unnecessary_raw_strings: false
    unnecessary_underscores: false
    use_colored_box: false
    use_is_even_rather_than_modulo: false
    use_late_for_private_fields_and_variables: false
    use_null_aware_elements: false
    use_raw_strings: false
    use_setters_to_change_properties: false

    # Stricter rules added per security/reliability audit (2026-07-09).
    # avoid_catches_without_on_clauses catches bare `catch (_)` that silently
    # swallow errors; prefer catching specific types or at minimum `catch (e, st)`.
    avoid_catches_without_on_clauses: true
    prefer_final_locals: true
    prefer_const_constructors: true
    use_super_parameters: true
    unnecessary_string_interpolations: true

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
