name: iOS Simulator Tests

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ios-simulator-tests.yml'
      - 'ios/**'
      - 'lib/**'
      - 'integration_test/**'
      - 'test/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-simulator-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test iOS Simulator app
    runs-on: macos-15
    environment: ios-release
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - name: Check Apple simulator toolchain
        run: |
          set -Eeuo pipefail
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Restore protected runtime configuration
        env:
          SCHOOLDESK_RELEASE_ENV_BASE64: ${{ secrets.SCHOOLDESK_RELEASE_ENV_BASE64 }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "$SCHOOLDESK_RELEASE_ENV_BASE64" ]] || {
            echo "::error::Missing GitHub environment secret: SCHOOLDESK_RELEASE_ENV_BASE64"
            exit 1
          }

          env_file="$RUNNER_TEMP/schooldesk-simulator.env.json"
          printf '%s' "$SCHOOLDESK_RELEASE_ENV_BASE64" | base64 --decode > "$env_file"
          chmod 600 "$env_file"
          jq -e '
            type == "object"
            and (.API_BASE_URL == "https://api.arishville.com/functions/v1/api")
            and (.SUPABASE_URL == "https://api.arishville.com")
            and (.SUPABASE_ANON_KEY | type == "string" and startswith("eyJ") and ((split(".")) | length == 3))
            and (.APP_ENV == "production")
            and ((.ENABLE_LOGGING | tostring) == "false")
            and (.FIREBASE_IOS_APP_ID | type == "string" and length > 0)
          ' "$env_file" >/dev/null || {
            echo "::error::VPS production environment is invalid or missing Firebase iOS settings."
            exit 1
          }
          printf 'SCHOOLDESK_ENV_FILE=%s\n' "$env_file" >> "$GITHUB_ENV"

      - name: Verify VPS API health
        shell: bash
        run: |
          set -Eeuo pipefail
          health_url="$(jq -r '.API_BASE_URL + "/health"' "$SCHOOLDESK_ENV_FILE")"
          anon_key="$(jq -r '.SUPABASE_ANON_KEY' "$SCHOOLDESK_ENV_FILE")"
          curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            --max-time 20 \
            -H "apikey: $anon_key" \
            -H "Authorization: Bearer $anon_key" \
            "$health_url" -o /dev/null

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Select and boot an iPhone Simulator
        shell: bash
        run: |
          set -Eeuo pipefail
          device_json="$(xcrun simctl list devices available -j)"
          device_udid="$(jq -r '[.devices | to_entries[] | .value[] | select(.name | startswith("iPhone"))] | .[0].udid // empty' <<<"$device_json")"
          device_name="$(jq -r '[.devices | to_entries[] | .value[] | select(.name | startswith("iPhone"))] | .[0].name // empty' <<<"$device_json")"
          [[ -n "$device_udid" ]] || {
            echo "::error::No available iPhone Simulator was found on the GitHub macOS runner."
            exit 1
          }

          xcrun simctl boot "$device_udid" 2>/dev/null || true
          xcrun simctl bootstatus "$device_udid" -b
          printf 'IOS_SIMULATOR_UDID=%s\n' "$device_udid" >> "$GITHUB_ENV"
          printf 'IOS_SIMULATOR_NAME=%s\n' "$device_name" >> "$GITHUB_ENV"
          printf '%s (%s)\n' "$device_name" "$device_udid" | tee "$RUNNER_TEMP/ios-simulator.txt"

      - name: Build unsigned iOS Simulator app
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p build/ios
          flutter build ios --simulator --debug \
            --dart-define-from-file="$SCHOOLDESK_ENV_FILE" \
            2>&1 | tee build/ios/simulator-build.log

      - name: Run iOS integration tests on Simulator
        shell: bash
        run: |
          set -Eeuo pipefail
          : > build/ios/simulator-test.log
          for test_file in \
            integration_test/auth_flow_test.dart \
            integration_test/role_modules_test.dart; do
            printf '\n===== %s =====\n' "$test_file" | tee -a build/ios/simulator-test.log
            flutter drive \
              --driver=test_driver/integration_test.dart \
              --target="$test_file" \
              --device-id="$IOS_SIMULATOR_UDID" \
              --dart-define-from-file="$SCHOOLDESK_ENV_FILE" \
              2>&1 | tee -a build/ios/simulator-test.log
          done

      - name: Collect simulator diagnostics
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          mkdir -p build/ios/simulator-diagnostics
          xcrun simctl spawn "$IOS_SIMULATOR_UDID" log show \
            --last 10m --style compact --debug --info \
            > build/ios/simulator-diagnostics/system.log 2>&1
          find "$HOME/Library/Logs/DiagnosticReports" \
            -type f -mmin -60 \( -iname '*Runner*' -o -iname '*arishville*' \) \
            -exec cp -f {} build/ios/simulator-diagnostics/ \; 2>/dev/null

      - name: Upload iOS simulator diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: schooldesk-ios-simulator-diagnostics-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/ios/simulator-build.log
            build/ios/simulator-test.log
            build/ios/simulator-diagnostics
            build/ios/simulator-name.txt

      - name: Upload iOS Simulator evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: schooldesk-ios-simulator-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/ios/iphonesimulator/*.app
            build/ios/simulator-build.log
            build/ios/simulator-test.log
            build/ios/simulator-diagnostics/**
            ${{ runner.temp }}/ios-simulator.txt

      - name: Shut down Simulator
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          if [[ -n "${IOS_SIMULATOR_UDID:-}" ]]; then
            xcrun simctl shutdown "$IOS_SIMULATOR_UDID"
          fi
          rm -f "${SCHOOLDESK_ENV_FILE:-}"
