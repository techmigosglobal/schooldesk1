name: Deploy SchoolDesk full backend

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY to promote the full backend to production"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: schooldesk-full-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirmation == 'DEPLOY' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v4

      - name: Configure pinned SSH access
        env:
          VPS_SSH_KEY: ${{ secrets.SCHOOLDESK_VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.SCHOOLDESK_VPS_KNOWN_HOSTS }}
        run: |
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          install -d -m 700 "$RUNNER_TEMP/schooldesk-ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/schooldesk-ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/schooldesk-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/schooldesk-ssh/id_ed25519" "$RUNNER_TEMP/schooldesk-ssh/known_hosts"

      - name: Promote reviewed full backend
        env:
          SCHOOLDESK_VPS_SSH_TARGET: ${{ secrets.SCHOOLDESK_VPS_SSH_TARGET }}
          SCHOOLDESK_SSH_KEY: ${{ runner.temp }}/schooldesk-ssh/id_ed25519
          SCHOOLDESK_SSH_KNOWN_HOSTS: ${{ runner.temp }}/schooldesk-ssh/known_hosts
        run: |
          test -n "$SCHOOLDESK_VPS_SSH_TARGET"
          scripts/deploy-vps-backend.sh

      - name: Verify production API health
        env:
          VPS_API_BASE_URL: ${{ secrets.SCHOOLDESK_VPS_API_BASE_URL }}
          VPS_ANON_KEY: ${{ secrets.SCHOOLDESK_VPS_ANON_KEY }}
        run: |
          test -n "$VPS_API_BASE_URL"
          test -n "$VPS_ANON_KEY"
          curl --fail --silent --show-error --max-time 20 \
            -H "apikey: $VPS_ANON_KEY" \
            -H "Authorization: Bearer $VPS_ANON_KEY" \
            "$VPS_API_BASE_URL/health" >/dev/null
