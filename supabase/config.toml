# This ID names only the Docker-local Supabase project. It is intentionally not
# the hosted project ref, so local CLI commands cannot target the hosted stack
# through this configuration.
project_id = "schooldesk-local"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
# Keep the application fixture and the tenant-isolation fixture separate. The
# CLI executes these in order on `supabase db reset`, which makes local RBAC
# and cross-school tests deterministic.
sql_paths = ["./seed.sql", "./seed_local_security.sql"]

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:54321"
additional_redirect_urls = [
  "http://localhost:3000",
  "http://localhost:8080",
  "http://localhost:54321",
  "http://127.0.0.1:54321",
]
jwt_expiry = 3600

[functions.api]
verify_jwt = false
static_files = ["./functions/api/assets/*.ttf"]
